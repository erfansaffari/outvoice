<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>

  .block { margin-bottom: 24px; }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .navypanel { background: var(--navy-700); padding: 18px 20px; border-radius: var(--radius-md); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Eyebrow, Tag, Badge, Stat } = window.DecoraDesignSystem_779afc;
    function Demo() {
      return (
        <React.Fragment>
          <div className="block">
            <div className="lbl">Buttons</div>
            <div className="row">
              <Button variant="primary">Send invoice</Button>
              <Button variant="secondary">Copy link</Button>
              <Button variant="accent">Pay now</Button>
              <Button variant="ghost" iconRight={<span>→</span>}>Share</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
          </div>
          <div className="block">
            <div className="lbl">Eyebrow · Tags</div>
            <div className="row">
              <Eyebrow>Voice fill</Eyebrow>
              <span style={{width:'14px'}}></span>
              <Tag variant="teal">Paid</Tag>
              <Tag variant="outline">Deposit</Tag>
              <Tag variant="navy">Wedding</Tag>
              <Tag variant="bronze">Premium</Tag>
            </div>
          </div>
          <div className="block">
            <div className="lbl">Badges</div>
            <div className="row">
              <Badge variant="success" dot>Paid</Badge>
              <Badge variant="info">Sent</Badge>
              <Badge variant="warning" dot>Overdue</Badge>
              <Badge variant="neutral">Draft</Badge>
            </div>
          </div>
          <div className="block">
            <div className="lbl">Stats</div>
            <div className="row" style={{gap:'48px'}}>
              <Stat value="60" suffix="sec" label="To send an invoice" sub="Voice note to pay link" />
              <Stat value="2" suffix="×" label="Faster to get paid" />
              <div className="navypanel"><Stat value="9" suffix="/10" label="Paid same day" tone="light" /></div>
            </div>
          </div>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
