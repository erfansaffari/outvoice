<!-- @dsCard group="Colors" viewport="700x170" name="Neutrals" subtitle="Warm cream grounds through stone to charcoal ink" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px; padding: 24px; }
  .col { display: flex; flex-direction: column; }
  .sw { height: 72px; border: 1px solid rgba(15,29,52,.06); }
  .lab { font-size: 11px; font-weight: 500; color: var(--text-body); margin: 8px 2px 1px; }
  .hex { font-size: 10px; color: var(--text-muted); margin: 0 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="sw" style="background:var(--cream-50)"></div><div class="lab">cream-50</div><div class="hex">#FBFAF6</div></div>
    <div class="col"><div class="sw" style="background:var(--cream-100)"></div><div class="lab">cream-100</div><div class="hex">#F6F3EC</div></div>
    <div class="col"><div class="sw" style="background:var(--cream-200)"></div><div class="lab">cream-200</div><div class="hex">#EDE8DD</div></div>
    <div class="col"><div class="sw" style="background:var(--cream-300)"></div><div class="lab">cream-300</div><div class="hex">#E0D9CA</div></div>
    <div class="col"><div class="sw" style="background:var(--stone-500)"></div><div class="lab">stone-500</div><div class="hex">#8C867A</div></div>
    <div class="col"><div class="sw" style="background:var(--charcoal-700)"></div><div class="lab">char-700</div><div class="hex">#2E3236</div></div>
    <div class="col"><div class="sw" style="background:var(--charcoal-800)"></div><div class="lab">char-800</div><div class="hex">#23272B</div></div>
    <div class="col"><div class="sw" style="background:var(--charcoal-900)"></div><div class="lab">char-900</div><div class="hex">#16191C</div></div>
  </div>
</body>
</html>
