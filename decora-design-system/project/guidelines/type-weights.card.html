<!-- @dsCard group="Type" viewport="700x150" name="Weights & eyebrow" subtitle="Light vs Medium, and the tracked uppercase label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 28px 32px; display: flex; gap: 48px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .w { font-size: 34px; color: var(--text-strong); line-height: 1; }
  .meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .eyebrow { font-size: var(--fs-eyebrow); font-weight: var(--fw-medium); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-accent); }
</style>
</head>
<body>
  <div class="col">
    <div><div class="w" style="font-weight:300">Everett Light</div><div class="meta">300 · display & body</div></div>
    <div><div class="w" style="font-weight:500">Everett Medium</div><div class="meta">500 · labels & emphasis</div></div>
  </div>
  <div class="col" style="border-left:1px solid var(--border-hairline);padding-left:48px">
    <div class="eyebrow">Get paid faster</div>
    <div class="eyebrow" style="color:var(--text-muted)">Why SnapBill</div>
    <div class="meta">eyebrow · 12 / 500 / 0.18em tracking</div>
  </div>
</body>
</html>
