<!-- @dsCard group="Type" viewport="700x260" name="Display scale" subtitle="Everett Light — architectural, tightly tracked" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 28px 32px; }
  .row { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--border-hairline); padding: 14px 0; }
  .row:last-child { border-bottom: 0; }
  .meta { width: 120px; flex: none; font-size: 11px; color: var(--text-muted); font-weight: 500; letter-spacing: .04em; }
  .spec { font-weight: var(--fw-light); color: var(--text-strong); letter-spacing: var(--ls-display); line-height: 1; }
</style>
</head>
<body>
  <div class="row"><div class="meta">display-xl<br>56–96 / 300</div><div class="spec" style="font-size:64px">Finish first</div></div>
  <div class="row"><div class="meta">display-l<br>44–68 / 300</div><div class="spec" style="font-size:48px">Coated to spec</div></div>
  <div class="row"><div class="meta">display-m<br>36–52 / 300</div><div class="spec" style="font-size:38px">Architectural finishing</div></div>
</body>
</html>
