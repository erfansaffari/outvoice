<!-- @dsCard group="Colors" viewport="700x150" name="Semantic & status" subtitle="Status colors and key surface/text aliases" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); }
  .wrap { padding: 24px; display: flex; gap: 28px; align-items: flex-start; }
  .group { display: flex; gap: 10px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .dot { width: 44px; height: 44px; border-radius: var(--radius-md); }
  .nm { font-size: 11px; color: var(--text-body); font-weight: 500; }
  .divider { width: 1px; align-self: stretch; background: var(--border-default); }
  .title { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
  .stack { display: flex; flex-direction: column; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stack">
      <div class="title">Status</div>
      <div class="group">
        <div class="chip"><div class="dot" style="background:var(--success)"></div><div class="nm">success</div></div>
        <div class="chip"><div class="dot" style="background:var(--warning)"></div><div class="nm">warning</div></div>
        <div class="chip"><div class="dot" style="background:var(--danger)"></div><div class="nm">danger</div></div>
        <div class="chip"><div class="dot" style="background:var(--info)"></div><div class="nm">info</div></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="stack">
      <div class="title">Surface / text aliases</div>
      <div class="group">
        <div class="chip"><div class="dot" style="background:var(--surface-page);border:1px solid var(--border-default)"></div><div class="nm">page</div></div>
        <div class="chip"><div class="dot" style="background:var(--surface-card);border:1px solid var(--border-default)"></div><div class="nm">card</div></div>
        <div class="chip"><div class="dot" style="background:var(--surface-inverse)"></div><div class="nm">inverse</div></div>
        <div class="chip"><div class="dot" style="background:var(--text-body)"></div><div class="nm">text</div></div>
        <div class="chip"><div class="dot" style="background:var(--text-accent)"></div><div class="nm">accent</div></div>
      </div>
    </div>
  </div>
</body>
</html>
